[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "github-agent"
version = "0.1.0"
description = "AI agents for GitHub interactions (PR review, etc.)"
requires-python = ">=3.10"
dependencies = [
    # LLM Gateway
    "portkey-ai>=1.0.0",
    # Agent Orchestration
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    # GitHub
    "PyGithub>=2.0.0",
    # Config
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
agentcore = [
    "bedrock-agentcore>=1.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
